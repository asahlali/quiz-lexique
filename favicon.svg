<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#5B21B6"/>
    <stop offset="1" stop-color="#2E1065"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#F472B6" stop-opacity=".9"/>
    <stop offset="0.45" stop-color="#C026D3" stop-opacity=".38"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFA552"/>
    <stop offset="0.55" stop-color="#F97316"/>
    <stop offset="1" stop-color="#D9480F"/>
  </linearGradient>
  <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EA580C"/>
    <stop offset="1" stop-color="#F97316"/>
  </linearGradient>
  <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFEBDD"/>
  </linearGradient>
  <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFE4C4" stop-opacity=".75"/>
    <stop offset="1" stop-color="#FFE4C4" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
  <clipPath id="round"><rect width="1024" height="1024" rx="232" ry="232"/></clipPath>
</defs><defs>
