    <circle cx="400" cy="318" r="84" fill="#FFFFFF"/>
    <circle cx="214" cy="326" r="38" fill="#21103A"/>
    <circle cx="386" cy="326" r="38" fill="#21103A"/>
    <circle cx="229" cy="310" r="13" fill="#FFFFFF"/>
    <circle cx="401" cy="310" r="13" fill="#FFFFFF"/>
    <circle cx="200" cy="318" r="84" fill="none" stroke="#21103A" stroke-width="20"/>
    <circle cx="400" cy="318" r="84" fill="none" stroke="#21103A" stroke-width="20"/>
    <path d="M276 306 Q300 290 324 306" fill="none" stroke="#21103A" stroke-width="18" stroke-linecap="round"/>
    <path d="M140 286 Q156 256 190 248" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".0"/>
  </g>
